name: Fantasy Football Sleeper Refresh

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'fantasy-football-tracker/**'
      - '.github/workflows/fantasy-football-refresh.yml'
  schedule:
    # Tuesday before the evening waiver report (UTC; shifts by one hour around DST)
    - cron: '0 22 * * 2'
    # Saturday before the morning lineup report
    - cron: '0 13 * * 6'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pull and normalize Sleeper data
        run: python fantasy-football-tracker/refresh_sleeper.py
      - name: Pull current consensus rankings
        run: python fantasy-football-tracker/refresh_external_rankings.py
      - name: Build ownership and exposure analysis
        run: python fantasy-football-tracker/build_exposure.py
      - name: Normalize league lifecycle states
        run: python fantasy-football-tracker/normalize_league_state.py
      - name: Build Tuesday waiver and cut board
        run: python fantasy-football-tracker/build_waivers.py
      - name: Refine waiver board with consensus and lineup eligibility
        run: python fantasy-football-tracker/refine_waivers_v2.py
      - name: Finalize waiver board with roster context
        run: python fantasy-football-tracker/finalize_waivers.py
      - name: Commit refreshed data
        run: |
          git config user.name "fantasy-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add fantasy-football-tracker/data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Refresh Sleeper fantasy data and analysis boards"
            git push
          fi
