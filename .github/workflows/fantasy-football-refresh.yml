name: Fantasy Football Sleeper Refresh

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'fantasy-football-tracker/**'
      - '.github/workflows/fantasy-football-refresh.yml'
  schedule:
    - cron: '0 22 * * 2'
    - cron: '0 13 * * 6'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pull and normalize Sleeper data
        run: python fantasy-football-tracker/refresh_sleeper.py
      - name: Pull current consensus rankings
        run: python fantasy-football-tracker/refresh_external_rankings.py
      - name: Pull weekly rankings and NFL game context
        run: python fantasy-football-tracker/refresh_weekly_context.py
      - name: Build game-time weather intelligence
        run: python fantasy-football-tracker/refresh_weather_intelligence.py
      - name: Build ownership and exposure analysis
        run: python fantasy-football-tracker/build_exposure.py
      - name: Normalize league lifecycle states
        run: python fantasy-football-tracker/normalize_league_state.py
      - name: Build current usage and snap intelligence
        run: python fantasy-football-tracker/refresh_usage_intelligence.py
      - name: Build offensive line health intelligence
        run: python fantasy-football-tracker/refresh_ol_health.py
      - name: Build offensive and defensive injury ripples
        run: python fantasy-football-tracker/refresh_injury_ripples.py
      - name: Build return-role and return-scoring intelligence
        run: python fantasy-football-tracker/refresh_return_intelligence.py
      - name: Refine returners with offensive depth context
        run: python fantasy-football-tracker/refine_return_intelligence.py
      - name: Build Tuesday waiver and cut board
        run: python fantasy-football-tracker/build_waivers.py
      - name: Refine waiver board with consensus and lineup eligibility
        run: python fantasy-football-tracker/refine_waivers_v2.py
      - name: Inject all return-yard waiver candidates
        run: python fantasy-football-tracker/inject_return_waivers.py
      - name: Apply current usage trends to waiver board
        run: python fantasy-football-tracker/apply_usage_waivers.py
      - name: Apply injury-created opportunity to waiver board
        run: python fantasy-football-tracker/apply_injury_ripples_waivers.py
      - name: Apply league return scoring to waiver board
        run: python fantasy-football-tracker/apply_return_waivers.py
      - name: Finalize waiver board with roster context
        run: python fantasy-football-tracker/finalize_waivers.py
      - name: Build Saturday lineup and matchup board
        run: python fantasy-football-tracker/build_saturday.py
      - name: Apply current usage trends to Saturday player scores
        run: python fantasy-football-tracker/apply_usage_saturday.py
      - name: Apply offensive line health to Saturday player scores
        run: python fantasy-football-tracker/apply_ol_saturday.py
      - name: Replace legacy weather with game-time forecast adjustments
        run: python fantasy-football-tracker/apply_weather_saturday.py
      - name: Apply offensive and defensive injury ripples
        run: python fantasy-football-tracker/apply_injury_ripples_saturday.py
      - name: Apply league return scoring to Saturday lineups
        run: python fantasy-football-tracker/apply_return_saturday.py
      - name: Add opponent threats and injury leverage
        run: python fantasy-football-tracker/finalize_saturday.py
      - name: Build playoff-push and rebuild trade targets
        run: python fantasy-football-tracker/build_trade_targets.py
      - name: Build unified fantasy command center
        run: python fantasy-football-tracker/build_command_center.py
      - name: Build visual fantasy war room
        run: python fantasy-football-tracker/build_war_room.py
      - name: Commit refreshed data
        run: |
          git config user.name "fantasy-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add fantasy-football-tracker/data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Refresh Sleeper fantasy data and analysis boards"
            git push
          fi
